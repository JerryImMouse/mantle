services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root 
      POSTGRES_DB: mantle_dev
    ports:
      - "5432:5432"
    volumes:
      - mantle_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mantle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mantle_db_data:
